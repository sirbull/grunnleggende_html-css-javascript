<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lær HTML, CSS og JavaScript med korte forklaringer, visuelle eksempler og et eget kodeverksted.">
    <meta name="theme-color" content="#174f42">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <title>Webverkstedet · Lær ved å bygge</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Hopp til innhold</a>
    <header class="site-header">
      <a class="brand" href="#/" aria-label="Webverkstedet, start"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><span>Webverkstedet<small>Lær ved å bygge.</small></span></a>
      <nav id="main-nav" aria-label="Hovedmeny"></nav>
      <div id="header-tools">
        <div class="speech-menu">
          <button id="speech-button" type="button" class="icon-button" aria-expanded="false" aria-controls="speech-panel"><span class="sr-only">Opplesning</span></button>
          <div id="speech-panel" class="speech-panel" role="region" aria-labelledby="speech-panel-title" hidden></div>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"><p class="loading" role="status">Henter læringsinnhold …</p></main>
    <footer class="site-footer"><span>Webverkstedet · 1.0</span><span>Et lite steg. En ny ferdighet.</span><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development">Lær mer hos MDN <span aria-hidden="true">↗</span></a></footer>
    <div id="speech-player" class="speech-player" role="region" aria-label="Avspiller for opplesning" hidden></div>
    <div class="sr-only" id="status" role="status"></div>
    <dialog id="glossary-dialog" aria-labelledby="glossary-title"></dialog>
    <dialog id="lesson-nav-dialog" class="nav-dialog" aria-labelledby="lesson-nav-title"></dialog>
    <noscript><p>Slå på JavaScript for å bruke læringsinnholdet og kodeverkstedet.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
